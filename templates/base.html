<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}My Flask Site{% endblock %}</title>
    <!-- 1. The Instant Auto-Theme Sync Script -->
    <script>
      (function () {
        const setSystemTheme = () => {
          const theme = window.matchMedia("(prefers-color-scheme: dark)")
            .matches
            ? "dark"
            : "light";
          document.documentElement.setAttribute("data-bs-theme", theme);
        };
        setSystemTheme();
        window
          .matchMedia("(prefers-color-scheme: dark)")
          .addEventListener("change", setSystemTheme);
      })();
    </script>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <!-- Bootstrap CSS from CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=BioRhyme:wght@200..800&family=Fascinate+Inline&display=swap"
      rel="stylesheet"
    />
    <!-- Your custom CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    {% block extra_css %}{% endblock %}
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- Navbar Navigation Fragment -->
    {% include 'partials/nav.html' %}
    <!-- Dynamic Content Area -->
    <main class="flex-grow-1">
      {% block content %}
      <!-- Page content from other templates injects here seamlessly -->
      {% endblock %}
    </main>
    <!-- Sticky Adaptive Layout Footer -->
    <footer class="bg-body-tertiary text-body py-3 mt-auto border-top">
      <div
        class="container d-flex justify-content-between align-items-center flex-wrap"
      >
        <small>&copy; 2026 My Flask Site</small>
        <small
          >Inspirations: Ellipsus, Pauls Online Math Notes, Mathspace
        </small>
        <small>Built with Flask</small>
        <small>Images designed by Magnific </small>
      </div>
    </footer>
    <!-- Bootstrap JavaScript Bundle from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
