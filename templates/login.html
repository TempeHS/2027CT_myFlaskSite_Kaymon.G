{% extends "base.html" %} {% block title %}Login - My Flask Site{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>Login</h2>
    <p class="text-muted">
    This is a demo form and does not authenticate users yet.
    </p>

    {% if message %}
    <div class="alert alert-info">{{ message }}</div>
    {% endif %}

    <form
    method="POST"
    action="{{ url_for('login') }}"
    class="mt-3"
    style="max-width: 420px"
    >
    <div class="mb-3">
            <label for="username" class="form-label">Username</label>
        <input
        id="username"
        name="username"
        type="text"
        class="form-control"
        value="{{ username }}"
        />
    </div>

    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input
        id="password"
        name="password"
        type="password"
        class="form-control"
        />
    </div>

    <button type="submit" class="btn btn-primary">Log In</button>
    </form>
</div>
{% endblock %}
